name: Test build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
  schedule:
    # Run once a week at 1 AM on Monday
  - cron: "0 1 * * 1"

permissions:
  contents: read

jobs:
  build:
    name: >-
      ${{ matrix.compiler.os }}
      | ${{ matrix.build_type }}
      | OpenMP=${{ matrix.openmp }}
      | Complex=${{ matrix.complex }}
      | Python=${{ matrix.python }}
      | ${{ matrix.compiler.name }}

    strategy:
      fail-fast: false

      matrix:
        build_type:
#Disable release build while there are no tests. If it builds in debug it will build in release
          - Debug
#          - Release
        openmp:
          - "ON"
          - "OFF"
        complex:
          - "ON"
          - "OFF"
        python:
          - "ON"
          - "OFF"
        compiler:
          # Ubuntu: GNU C++ + GNU Fortran
          - name: GNU
            os: ubuntu-24.04
            cxx: g++-14
            fc: gfortran-14

          # Ubuntu: LLVM Clang + LLVM Flang
          - name: LLVM
            os: ubuntu-24.04
            cxx: clang++-19
            fc: flang-new-19

          # macOS: GNU C++ + GNU Fortran
          - name: GNU
            os: macos-15
            cxx: g++-14
            fc: gfortran-14

          # macOS: Apple Clang from Xcode + GNU Fortran
          - name: AppleClang
            os: macos-15
            cxx: /usr/bin/clang++
            fc: gfortran-14

    runs-on: ${{ matrix.compiler.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        if: matrix.python == 'ON'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install GNU compilers
        if: runner.os == 'Linux' && matrix.compiler.name == 'GNU'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            g++-14 \
            gfortran-14

      - name: Install LLVM compilers
        if: runner.os == 'Linux' && matrix.compiler.name == 'LLVM'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang-19 \
            flang-19 \
            libomp-19-dev

      - name: Install OpenMP for AppleClang
        if: >-
          runner.os == 'macOS'
          && matrix.compiler.name == 'AppleClang'
          && matrix.openmp == 'ON'
        run: |
          brew install libomp

      - name: Show compiler versions
        run: |
          echo "Compiler versions"
          echo "CMake:"
          cmake --version

          echo "C compiler:"
          ${{ matrix.compiler.cc }} --version

          echo "C++ compiler:"
          ${{ matrix.compiler.cxx }} --version

          echo "Fortran compiler:"
          ${{ matrix.compiler.fc }} --version

      - name: Install Python dependencies
        if: matrix.python == 'ON'
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r python/requirements-dev.txt

      - name: Configure CMake
        shell: bash
        run: |
          CMAKE_ARGS=(
            -S src
            -B build
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
            -DANSATZEVOLVE_OPENMP=${{ matrix.openmp }}
            -DCOMPLEX_MODE=${{ matrix.complex }}
            -DANSATZEVOLVE_COMPILE_PYTHON_LIBS=${{ matrix.python }}
            -DCMAKE_CXX_COMPILER=${{ matrix.compiler.cxx }}
            -DCMAKE_Fortran_COMPILER=${{ matrix.compiler.fc }}
          )

          # CMake does not automatically find Homebrew libomp with
          # AppleClang on macOS.
          if [[ \
            "${{ matrix.compiler.name }}" == "AppleClang" \
            && "${{ matrix.openmp }}" == "ON" \
          ]]; then
            LIBOMP_PREFIX="$(brew --prefix libomp)"

            CMAKE_ARGS+=(
              "-DOpenMP_CXX_FLAGS=-Xpreprocessor -fopenmp -I${LIBOMP_PREFIX}/include"
              "-DOpenMP_CXX_LIB_NAMES=omp"
              "-DOpenMP_omp_LIBRARY=${LIBOMP_PREFIX}/lib/libomp.dylib"
            )
          fi

          cmake "${CMAKE_ARGS[@]}"

      - name: Build
        run: cmake --build build --parallel 2 --target all

      # - name: Test
      # For future reference
      #   run: ctest --test-dir build --output-on-failure


