name: Compiler portability

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
  schedule:
    # Run every day at 3 AM
    - cron: '0 3 * * *'

permissions:
  contents: read

jobs:
  linux:
    name: >-
      Linux
      | ${{ matrix.compiler }}
      | ${{ matrix.configuration }}

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false

      matrix:
        include:
          - compiler: GCC
            cc: gcc
            cxx: g++
            fc: gfortran
            configuration: default
            openmp: "ON"
            complex: "OFF"
            python: "OFF"

          - compiler: GCC
            cc: gcc
            cxx: g++
            fc: gfortran
            configuration: everything-on
            openmp: "ON"
            complex: "ON"
            python: "ON"

          - compiler: Clang
            cc: clang
            cxx: clang++
            fc: gfortran
            configuration: default
            openmp: "ON"
            complex: "OFF"
            python: "OFF"

          - compiler: Clang
            cc: clang
            cxx: clang++
            fc: gfortran
            configuration: everything-on
            openmp: "ON"
            complex: "ON"
            python: "ON"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            clang \
            cmake \
            gfortran \
            libomp-dev \
            python3 \
            python3-pip

      - name: Install Python dependencies
        if: matrix.python == 'ON'
        run: |
          make python-deps

      - name: Build and test
        run: |
          make test \
            BUILD_TYPE=Release \
            OPENMP=${{ matrix.openmp }} \
            COMPLEX=${{ matrix.complex }} \
            PYTHON=${{ matrix.python }} \
            CC=${{ matrix.cc }} \
            CXX=${{ matrix.cxx }} \
            FC=${{ matrix.fc }}

  macos:
    name: >-
      macOS
      | AppleClang
      | ${{ matrix.configuration }}

    runs-on: macos-latest

    strategy:
      fail-fast: false

      matrix:
        include:
          - configuration: default-no-openmp
            openmp: "OFF"
            complex: "OFF"
            python: "OFF"

          - configuration: complex-python
            openmp: "OFF"
            complex: "ON"
            python: "ON"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew install cmake gcc

      - name: Install Python dependencies
        if: matrix.python == 'ON'
        run: |
          make python-deps

      - name: Locate gfortran
        run: |
          echo "GFORTRAN=$(which gfortran || ls $(brew --prefix)/bin/gfortran-* | head -1)" >> "$GITHUB_ENV"

      - name: Build and test
        run: |
          make test \
            BUILD_TYPE=Release \
            OPENMP=${{ matrix.openmp }} \
            COMPLEX=${{ matrix.complex }} \
            PYTHON=${{ matrix.python }} \
            CC=clang \
            CXX=clang++ \
            FC=${GFORTRAN}